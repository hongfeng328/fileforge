[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileforge"
version = "0.2.0"
description = "FileForge - deterministic file processing tools (PDF tables, merge, images) exposed as a remote MCP server."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pymupdf",
    "pdfplumber",
    "openpyxl",
    "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]
